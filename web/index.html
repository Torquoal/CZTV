<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CZTV — Camera Panel Prototype</title>
    <style>
      :root {
        --bg: #0b0f17;
        --text: #e8eefc;
        --muted: #a7b3cc;
        --gap: 0px;
        --radius: 0px;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans";
        background: var(--bg);
        color: var(--text);
      }
      .app {
        height: 100%;
        display: grid;
        grid-template-rows: 1fr;
      }
      main {
        padding: var(--gap);
        height: 100%;
        box-sizing: border-box;
      }
      .grid {
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: var(--gap);
      }
      .tile {
        position: relative;
        border-radius: var(--radius);
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.06);
        background: rgba(255, 255, 255, 0.03);
        display: grid;
        grid-template-rows: 1fr;
        touch-action: manipulation;
        user-select: none;
      }
      .tileBody {
        position: relative;
        display: grid;
        place-items: center;
        background: #0f1622;
        overflow: hidden;
      }
      .placeholder {
        padding: 16px;
        text-align: center;
        color: var(--muted);
        line-height: 1.4;
        max-width: 520px;
        white-space: pre-wrap;
      }
      .feed {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        background: #000;
      }
      .feed:not([data-ready="true"]) {
        display: none;
      }
      .tile[data-ready="true"] .placeholder {
        display: none;
      }
      .maximized .grid {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr;
      }
      .maximized .tile {
        display: none;
      }
      .maximized .tile[data-max="true"] {
        display: grid;
      }

      /* Researcher-only startup overlay (hidden once camera is live). */
      #startOverlay[hidden] {
        display: none;
      }
      #startOverlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, 0.88);
        touch-action: manipulation;
      }
      #startOverlay button {
        font: inherit;
        font-weight: 900;
        font-size: 22px;
        padding: 18px 24px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #ffffff;
        background: rgba(255, 255, 255, 0.08);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <main>
        <div class="grid" id="grid">
          <div class="tile" data-tile="1">
            <div class="tileBody">
              <div class="placeholder"></div>
              <video class="feed" autoplay muted playsinline></video>
            </div>
          </div>
          <div class="tile" data-tile="2">
            <div class="tileBody">
              <div class="placeholder"></div>
              <video class="feed" autoplay muted playsinline></video>
            </div>
          </div>
          <div class="tile" data-tile="3">
            <div class="tileBody">
              <div class="placeholder"></div>
              <video class="feed" autoplay muted playsinline></video>
            </div>
          </div>
          <div class="tile" data-tile="4">
            <div class="tileBody">
              <div class="placeholder"></div>
              <video class="feed" autoplay muted playsinline></video>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div id="startOverlay" hidden>
      <button id="btnStart" type="button">Start</button>
    </div>

    <script src="cztv-shared.js"></script>
    <script>
      const tiles = Array.from(document.querySelectorAll(".tile"));

      const sessionId =
        (typeof crypto !== "undefined" && crypto.randomUUID && crypto.randomUUID()) ||
        `sess_${Date.now()}_${Math.random().toString(16).slice(2)}`;
      const LOG_KEY = "cztv_usage_log_v1";
      const LOG_MAX = 2000;

      const { CHANNEL, readState, writeState, PRESETS, NETWORK_STREAM_STUBS } = window.CZTV;

      /** @type {{ participantId: string, mode: string, preset: string }} */
      let runtimeState = readState();

      let bc = null;
      try {
        bc = new BroadcastChannel(CHANNEL);
      } catch {
        /* ignore */
      }

      function nowIso() {
        return new Date().toISOString();
      }

      function readLog() {
        try {
          const raw = localStorage.getItem(LOG_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      }

      function writeLog(entries) {
        try {
          localStorage.setItem(LOG_KEY, JSON.stringify(entries.slice(-LOG_MAX)));
        } catch {
          // Best-effort only (storage may be disabled / full).
        }
      }

      let serverQueue = [];
      let serverFlushTimer = null;

      function enqueueForServer(entry) {
        serverQueue.push(entry);
        if (!serverFlushTimer) {
          serverFlushTimer = setTimeout(flushToServer, 1000);
        }
      }

      async function flushToServer() {
        serverFlushTimer = null;
        if (!serverQueue.length) return;

        const batch = serverQueue;
        serverQueue = [];
        try {
          await fetch("/log", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ events: batch }),
            keepalive: true,
          });
        } catch {
          serverQueue = batch.concat(serverQueue);
          serverFlushTimer = setTimeout(flushToServer, 5000);
        }
      }

      window.addEventListener("beforeunload", () => {
        if (serverQueue.length) {
          try {
            navigator.sendBeacon("/log", JSON.stringify({ events: serverQueue }));
          } catch {
            /* ignore */
          }
        }
      });

      function logContext() {
        return {
          participantId: runtimeState.participantId || "",
          mode: runtimeState.mode,
          preset: runtimeState.preset,
        };
      }

      function logEvent(type, details) {
        const entry = {
          ts: nowIso(),
          sessionId,
          type,
          ...logContext(),
          ...details,
        };
        const next = readLog();
        next.push(entry);
        writeLog(next);
        console.log("[CZTV]", entry);
        enqueueForServer(entry);
      }

      logEvent("app_start", { href: location.href });

      function setMax(tileEl, reason) {
        tiles.forEach((t) => t.setAttribute("data-max", t === tileEl ? "true" : "false"));
        document.body.classList.add("maximized");
        logEvent("tile_maximize", {
          tile: tileEl.getAttribute("data-tile"),
          reason,
        });
      }

      function setFourUp(reason) {
        const active = document.querySelector('.tile[data-max="true"]');
        tiles.forEach((t) => t.removeAttribute("data-max"));
        document.body.classList.remove("maximized");
        logEvent("tile_minimize", {
          tile: active ? active.getAttribute("data-tile") : null,
          reason,
        });
      }

      tiles.forEach((t) => {
        t.addEventListener("click", () => {
          if (document.body.classList.contains("maximized")) return setFourUp("tap");
          return setMax(t, "tap");
        });
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") setFourUp("esc");
      });

      const startOverlay = document.getElementById("startOverlay");
      const startBtn = document.getElementById("btnStart");
      const feeds = Array.from(document.querySelectorAll("video.feed"));
      let activeStreams = [];
      let mediaInFlight = false;

      function setOverlayLabel(mode) {
        if (mode === "recorded") startBtn.textContent = "Tap to play";
        else if (mode === "network") startBtn.textContent = "Load network streams";
        else startBtn.textContent = "Start camera";
      }

      function showOverlay() {
        setOverlayLabel(runtimeState.mode);
        startOverlay.hidden = false;
      }

      function hideOverlay() {
        startOverlay.hidden = true;
      }

      function clearRecordedVideos() {
        feeds.forEach((v) => {
          try {
            v.pause();
          } catch {
            /* ignore */
          }
          v.removeAttribute("src");
          v.srcObject = null;
          try {
            v.load();
          } catch {
            /* ignore */
          }
          const ph = v.closest(".tileBody")?.querySelector(".placeholder");
          if (ph) ph.textContent = "";
        });
      }

      function clearTileReady() {
        feeds.forEach((v) => {
          v.removeAttribute("data-ready");
          const tile = v.closest(".tile");
          if (tile) tile.removeAttribute("data-ready");
        });
      }

      function attachStreamToTiles(stream, tileIndexes) {
        tileIndexes.forEach((idx) => {
          const v = feeds[idx];
          if (!v) return;
          v.srcObject = stream;
          v.dataset.ready = "true";
          v.closest(".tile").dataset.ready = "true";
        });
      }

      function stopAllStreams() {
        activeStreams.forEach((s) => s.getTracks().forEach((t) => t.stop()));
        activeStreams = [];
      }

      async function getVideoInputs() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        return devices.filter((d) => d.kind === "videoinput");
      }

      async function startLiveCameras() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showOverlay();
          return;
        }
        startBtn.disabled = true;
        try {
          clearRecordedVideos();
          clearTileReady();

          const warmupStream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false,
          });
          warmupStream.getTracks().forEach((t) => t.stop());

          const inputs = await getVideoInputs();

          if (inputs.length >= 2) {
            const [camA, camB] = inputs;
            const [streamA, streamB] = await Promise.all([
              navigator.mediaDevices.getUserMedia({
                video: { deviceId: { exact: camA.deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false,
              }),
              navigator.mediaDevices.getUserMedia({
                video: { deviceId: { exact: camB.deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false,
              }),
            ]);
            activeStreams = [streamA, streamB];
            attachStreamToTiles(streamA, [0, 1]);
            attachStreamToTiles(streamB, [2, 3]);
          } else {
            const stream = await navigator.mediaDevices.getUserMedia({
              video: { width: { ideal: 1280 }, height: { ideal: 720 } },
              audio: false,
            });
            activeStreams = [stream];
            attachStreamToTiles(stream, [0, 1, 2, 3]);
          }

          hideOverlay();
        } catch (err) {
          stopAllStreams();
          clearTileReady();
          startBtn.disabled = false;
          showOverlay();
        }
      }

      async function startRecordedVideos() {
        startBtn.disabled = true;
        try {
          stopAllStreams();
          clearRecordedVideos();
          clearTileReady();

          const urls = PRESETS[runtimeState.preset] || PRESETS.default;
          feeds.forEach((v, i) => {
            v.muted = true;
            v.loop = true;
            v.playsInline = true;
            v.srcObject = null;
            v.src = urls[i] || "";
          });

          let ok = 0;
          for (const v of feeds) {
            try {
              await v.play();
              ok += 1;
            } catch {
              /* autoplay policy or missing file */
            }
          }

          if (ok === feeds.length) {
            feeds.forEach((v) => {
              v.dataset.ready = "true";
              const tile = v.closest(".tile");
              if (tile) tile.dataset.ready = "true";
            });
            hideOverlay();
            startBtn.disabled = false;
          } else {
            clearTileReady();
            startBtn.disabled = false;
            setOverlayLabel("recorded");
            showOverlay();
          }
        } catch {
          clearTileReady();
          startBtn.disabled = false;
          setOverlayLabel("recorded");
          showOverlay();
        }
      }

      async function startNetworkStreams() {
        startBtn.disabled = true;
        try {
          stopAllStreams();
          clearRecordedVideos();
          clearTileReady();

          const stubs = Array.isArray(NETWORK_STREAM_STUBS) ? NETWORK_STREAM_STUBS : [];
          feeds.forEach((v, i) => {
            const url = stubs[i] || "";
            const ph = v.closest(".tileBody")?.querySelector(".placeholder");
            if (ph) {
              ph.textContent = url ? `Network camera ${i + 1} (stub)\n${url}` : `Network camera ${i + 1} (no URL configured)`;
            }
            v.muted = true;
            v.loop = false;
            v.playsInline = true;
            v.srcObject = null;
            v.src = url;
          });

          let ok = 0;
          for (const v of feeds) {
            try {
              await v.play();
              ok += 1;
            } catch {
              /* missing gateway, CORS, codec, or autoplay */
            }
          }

          if (ok === feeds.length) {
            feeds.forEach((v) => {
              v.dataset.ready = "true";
              const tile = v.closest(".tile");
              if (tile) tile.dataset.ready = "true";
            });
            hideOverlay();
            startBtn.disabled = false;
          } else {
            clearTileReady();
            startBtn.disabled = false;
            setOverlayLabel("network");
            showOverlay();
          }
        } catch {
          clearTileReady();
          startBtn.disabled = false;
          setOverlayLabel("network");
          showOverlay();
        }
      }

      async function applyMediaFromState() {
        if (mediaInFlight) return;
        mediaInFlight = true;
        try {
          if (runtimeState.mode === "recorded") {
            await startRecordedVideos();
          } else if (runtimeState.mode === "network") {
            await startNetworkStreams();
          } else {
            await startLiveCameras();
          }
        } finally {
          mediaInFlight = false;
        }
      }

      function applyRemoteState(next, opts) {
        const forceMedia = Boolean(opts && opts.forceMedia);
        const prev = { ...runtimeState };
        runtimeState = writeState(next);

        if (prev.participantId !== runtimeState.participantId) {
          logEvent("participant_change", {
            fromParticipantId: prev.participantId || "",
            toParticipantId: runtimeState.participantId || "",
          });
        }

        const modeChanged = prev.mode !== runtimeState.mode;
        const needMedia =
          forceMedia ||
          modeChanged ||
          (runtimeState.mode === "recorded" &&
            (prev.mode !== "recorded" || prev.preset !== runtimeState.preset));

        if (needMedia && modeChanged) {
          logEvent("mode_change", {
            fromMode: prev.mode,
            toMode: runtimeState.mode,
            preset: runtimeState.preset,
          });
        } else if (needMedia && !modeChanged && runtimeState.mode === "recorded" && prev.preset !== runtimeState.preset) {
          logEvent("preset_change", {
            fromPreset: prev.preset,
            toPreset: runtimeState.preset,
          });
        }

        if (needMedia) {
          applyMediaFromState();
        }
      }

      if (bc) {
        bc.addEventListener("message", (ev) => {
          if (!ev.data || ev.data.type !== "state" || !ev.data.payload) return;
          applyRemoteState(ev.data.payload);
        });
      }

      window.addEventListener("storage", (e) => {
        if (e.key !== window.CZTV.STORAGE_KEY || e.newValue == null) return;
        try {
          applyRemoteState(JSON.parse(e.newValue));
        } catch {
          /* ignore */
        }
      });

      startBtn.addEventListener("click", () => {
        applyMediaFromState();
      });

      applyRemoteState(readState(), { forceMedia: true });
    </script>
  </body>
</html>
