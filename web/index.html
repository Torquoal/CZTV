<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>CZTV — Camera Panel Prototype</title>
    <style>
      :root {
        --bg: #0b0f17;
        --text: #e8eefc;
        --muted: #a7b3cc;
        --gap: 0px;
        --radius: 0px;
        --chrome-shield: 72px;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans";
        background: var(--bg);
        color: var(--text);
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      .app {
        height: 100%;
        display: grid;
        grid-template-rows: 1fr;
      }
      main {
        padding: var(--gap);
        height: 100%;
        box-sizing: border-box;
      }
      .grid {
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: var(--gap);
      }
      .tile {
        position: relative;
        border-radius: var(--radius);
        overflow: hidden;
        border: 0;
        /* White frame matches touch dead-zone (--tile-inset synced from control panel). */
        padding: var(--tile-inset, 36px);
        background: #ffffff;
        display: grid;
        grid-template-rows: 1fr;
        touch-action: manipulation;
        user-select: none;
        box-sizing: border-box;
      }
      .tileBody {
        position: relative;
        display: grid;
        place-items: center;
        background: #0f1622;
        overflow: hidden;
        min-height: 0;
        min-width: 0;
        width: 100%;
        height: 100%;
        border-radius: 2px;
      }
      .placeholder {
        padding: 16px;
        text-align: center;
        color: var(--muted);
        line-height: 1.4;
        max-width: 520px;
        white-space: pre-wrap;
      }
      .feed {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        background: #000;
      }
      .feed:not([data-ready="true"]) {
        display: none;
      }
      .tile[data-ready="true"] .placeholder {
        display: none;
      }
      .maximized .grid {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr;
      }
      .maximized .tile {
        display: none;
      }
      .maximized .tile[data-max="true"] {
        display: grid;
      }

      /* Experimental close-button exit (top-right X when maximized). */
      #maxCloseBtn[hidden] {
        display: none;
      }
      #maxCloseBtn {
        position: fixed;
        top: 0;
        right: 0;
        width: 200px;
        height: 200px;
        z-index: 12500;
        margin: 0;
        padding: 24px;
        border: 0;
        border-radius: 0;
        background: #ffffff;
        cursor: pointer;
        touch-action: manipulation;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      #maxCloseBtn img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        pointer-events: none;
      }

      /* Absorbs top-edge swipes that would reveal browser chrome in non-kiosk fullscreen. */
      #chromeShield {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: var(--chrome-shield);
        z-index: 12000;
        background: transparent;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #chromeShield[hidden] {
        display: none;
      }

      /* Emergency stop.png — covers everything until researcher resumes. */
      #stopScreen[hidden] {
        display: none;
      }
      #stopScreen {
        position: fixed;
        inset: 0;
        z-index: 14000;
        margin: 0;
        padding: 0;
        border: 0;
        background: #000;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #stopScreen img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        pointer-events: none;
      }

      /* Full-screen home / start image (tap to enter wall; hotkey b to return). */
      #homeScreen[hidden] {
        display: none;
      }
      #homeScreen {
        position: fixed;
        inset: 0;
        z-index: 10050;
        margin: 0;
        padding: 0;
        border: 0;
        background: #000;
        cursor: pointer;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
      }
      #homeScreen img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        pointer-events: none;
      }

      /* Researcher-only media fallback overlay (if autoplay/streams fail). */
      #startOverlay[hidden] {
        display: none;
      }
      #startOverlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, 0.88);
        touch-action: manipulation;
      }
      #startOverlay button {
        font: inherit;
        font-weight: 900;
        font-size: 22px;
        padding: 18px 24px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #ffffff;
        background: rgba(255, 255, 255, 0.08);
        cursor: pointer;
      }

      /* Researcher coding HUD (small; not for chimps). */
      #coderHud[hidden] {
        display: none;
      }
      #coderHud {
        position: fixed;
        left: 10px;
        bottom: 10px;
        z-index: 50;
        max-width: min(420px, 70vw);
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.55);
        color: #d7e0f2;
        font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        pointer-events: none;
        opacity: 0.85;
      }
      #coderHud strong {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <main>
        <div class="grid" id="grid">
          <div class="tile" data-slot="1">
            <div class="tileBody">
              <div class="placeholder"></div>
              <video class="feed" autoplay muted playsinline></video>
            </div>
          </div>
          <div class="tile" data-slot="2">
            <div class="tileBody">
              <div class="placeholder"></div>
              <video class="feed" autoplay muted playsinline></video>
            </div>
          </div>
          <div class="tile" data-slot="3">
            <div class="tileBody">
              <div class="placeholder"></div>
              <video class="feed" autoplay muted playsinline></video>
            </div>
          </div>
          <div class="tile" data-slot="4">
            <div class="tileBody">
              <div class="placeholder"></div>
              <video class="feed" autoplay muted playsinline></video>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div id="chromeShield" hidden aria-hidden="true" title="Top-edge guard"></div>

    <button id="maxCloseBtn" type="button" hidden aria-label="Close maximized view">
      <img src="/media/stop.png" alt="" draggable="false" />
    </button>

    <div id="homeScreen" role="button" aria-label="Start screen — tap to open wall" tabindex="0">
      <img src="/media/placeholder.png" alt="" draggable="false" />
    </div>

    <div id="stopScreen" hidden aria-label="Emergency stop" aria-live="assertive">
      <img src="/media/stop.png" alt="Stop" draggable="false" />
    </div>

    <div id="startOverlay" hidden>
      <button id="btnStart" type="button">Start</button>
    </div>

    <div id="coderHud" hidden aria-live="polite">
      <div>Active: <strong id="hudActive">—</strong></div>
      <div>Present: <strong id="hudPresent">—</strong></div>
      <div>Layout: <strong id="hudLayout">—</strong></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script src="cztv-shared.js?v=15"></script>
    <script>
      const tiles = Array.from(document.querySelectorAll(".tile"));
      const coderHud = document.getElementById("coderHud");

      const CZTV = window.CZTV || {};
      const CHANNEL = CZTV.CHANNEL || "cztv-control";
      const makeSessionId =
        CZTV.makeSessionId ||
        (() => {
          const d = new Date();
          const pad = (n) => String(n).padStart(2, "0");
          return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
        });
      const sessionId = makeSessionId();
      const LOG_KEY = "cztv_usage_log_v1";
      const LOG_MAX = 2000;

      const readState =
        CZTV.readState ||
        (() => ({
          participantId: "PX",
          presentIds: [],
          randomizeLayout: true,
          showCoderHud: false,
          lockFullscreen: true,
          emergencyStop: false,
          closeButtonExit: false,
          tapCooldownMs: 2000,
          edgeDeadZonePx: 48,
          idleResetMs: 300000,
        }));
      const writeState = CZTV.writeState || ((s) => s);
      const VIDEO_SETS = CZTV.VIDEO_SETS || {
        familiar: ["/media/chimpvid.mp4", "/media/chimps2vid.mp4"],
        unfamiliar: ["/media/jungle.mp4", "/media/crossing.mp4"],
      };
      const VIEW_LABELS = CZTV.VIEW_LABELS || {
        live1: "live 1 BRU",
        live2: "live 2 enclosure",
        unfamiliar: "video 1 unfamiliar",
        familiar: "video 2 familiar",
      };
      const liveCamerasPayload =
        CZTV.liveCamerasPayload ||
        (() => ({ cameras: [], tileMap: [0, 1, 2, 3] }));
      const resolvePidHotkey = CZTV.resolvePidHotkey || (() => null);
      const isTypingTarget = CZTV.isTypingTarget || (() => false);
      const normalizePresentIds = CZTV.normalizePresentIds || ((ids) => (Array.isArray(ids) ? ids : []));
      const normalizeLayoutOrder =
        CZTV.normalizeLayoutOrder ||
        ((order) =>
          Array.isArray(order) && order.length === 4
            ? order
            : ["live1", "live2", "familiar", "unfamiliar"]);
      const takeSessionLayout =
        CZTV.takeSessionLayout ||
        ((counterbalance) => {
          const order = ["live1", "live2", "familiar", "unfamiliar"];
          return { order, layoutIndex: counterbalance ? 0 : -1 };
        });

      /** @type {{ participantId: string, presentIds: string[], randomizeLayout: boolean }} */
      let runtimeState = readState();
      /** Counterbalance on → next of 24 fixed permutations; off → default order. */
      const sessionLayout = takeSessionLayout(runtimeState.randomizeLayout !== false);
      /** @type {string[]} screen slots 0–3 → view ids for this wall session */
      let layoutOrder = normalizeLayoutOrder(sessionLayout.order);
      /** @type {number} 0–23 when counterbalancing; -1 when fixed */
      let layoutIndex = Number.isFinite(sessionLayout.layoutIndex) ? sessionLayout.layoutIndex : -1;

      const hudActive = document.getElementById("hudActive");
      const hudPresent = document.getElementById("hudPresent");
      const hudLayout = document.getElementById("hudLayout");

      function updateCoderHud() {
        if (coderHud) coderHud.hidden = runtimeState.showCoderHud !== true;
        if (hudActive) hudActive.textContent = runtimeState.participantId || "—";
        if (hudPresent) {
          const list = normalizePresentIds(runtimeState.presentIds);
          hudPresent.textContent = list.length ? list.join(" ") : "—";
        }
        if (hudLayout) {
          const mode =
            runtimeState.randomizeLayout !== false
              ? `cb ${layoutIndex + 1}/24`
              : "fixed";
          hudLayout.textContent = `${mode}: ${layoutOrder
            .map((v, i) => `${i + 1}=${contentLabelForView(v)}`)
            .join(" · ")}`;
        }
        syncTileInset();
        syncMaxCloseButton();
      }

      let lastTapAt = 0;
      let lastActivityAt = Date.now();

      function noteActivity() {
        lastActivityAt = Date.now();
      }

      function tapCooldownMs() {
        const n = Number(runtimeState.tapCooldownMs);
        return Number.isFinite(n) ? Math.max(0, n) : 2000;
      }

      function edgeDeadZonePx() {
        const n = Number(runtimeState.edgeDeadZonePx);
        return Number.isFinite(n) ? Math.max(0, n) : 36;
      }

      function idleResetMs() {
        const n = Number(runtimeState.idleResetMs);
        // Floor at 1 minute (control panel minimum).
        return Number.isFinite(n) ? Math.max(60000, n) : 300000;
      }

      function syncTileInset() {
        document.documentElement.style.setProperty("--tile-inset", `${edgeDeadZonePx()}px`);
      }

      function inCooldown() {
        return Date.now() - lastTapAt < tapCooldownMs();
      }

      function markTap() {
        lastTapAt = Date.now();
        noteActivity();
      }

      /** Ignore taps near tile edges (reduces accidental neighbour selection). */
      function isInTileDeadZone(tileEl, clientX, clientY) {
        const inset = edgeDeadZonePx();
        if (!inset || clientX == null || clientY == null) return false;
        const r = tileEl.getBoundingClientRect();
        if (r.width <= inset * 2 || r.height <= inset * 2) return false;
        return (
          clientX < r.left + inset ||
          clientX > r.right - inset ||
          clientY < r.top + inset ||
          clientY > r.bottom - inset
        );
      }

      function applyLayoutToDom() {
        tiles.forEach((tileEl, i) => {
          const view = layoutOrder[i] || `unknown${i + 1}`;
          tileEl.dataset.slot = String(i + 1);
          tileEl.dataset.view = view;
          tileEl.dataset.tile = String(i + 1);
        });
      }

      function slotIndexForView(viewId) {
        return layoutOrder.indexOf(viewId);
      }

      function contentLabelForView(viewId) {
        return VIEW_LABELS[viewId] || viewId || "";
      }

      function tileLogFields(tileEl) {
        if (!tileEl) {
          return { tile: "", content: "", viewId: "" };
        }
        const slot = tileEl.getAttribute("data-slot") || tileEl.getAttribute("data-tile") || "";
        const viewId = tileEl.getAttribute("data-view") || "";
        const content = contentLabelForView(viewId);
        return {
          // CSV columns: tile = position 1–4; content = "live 1 BRU" etc.
          tile: slot,
          content,
          viewId,
        };
      }

      function broadcastLayout() {
        if (!bc) return;
        try {
          bc.postMessage({
            type: "layout",
            payload: {
              layoutOrder: layoutOrder.slice(),
              layoutIndex,
              randomizeLayout: runtimeState.randomizeLayout !== false,
            },
          });
        } catch {
          /* ignore */
        }
      }

      let bc = null;
      try {
        bc = new BroadcastChannel(CHANNEL);
      } catch {
        /* ignore */
      }

      function nowIso() {
        return new Date().toISOString();
      }

      function readLog() {
        try {
          const raw = localStorage.getItem(LOG_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      }

      function writeLog(entries) {
        try {
          localStorage.setItem(LOG_KEY, JSON.stringify(entries.slice(-LOG_MAX)));
        } catch {
          // Best-effort only (storage may be disabled / full).
        }
      }

      let serverQueue = [];
      let serverFlushTimer = null;

      function enqueueForServer(entry) {
        serverQueue.push(entry);
        if (!serverFlushTimer) {
          serverFlushTimer = setTimeout(flushToServer, 1000);
        }
      }

      async function flushToServer() {
        serverFlushTimer = null;
        if (!serverQueue.length) return;

        const batch = serverQueue;
        serverQueue = [];
        try {
          await fetch("/log", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ events: batch }),
            keepalive: true,
          });
        } catch {
          serverQueue = batch.concat(serverQueue);
          serverFlushTimer = setTimeout(flushToServer, 5000);
        }
      }

      window.addEventListener("beforeunload", () => {
        if (serverQueue.length) {
          try {
            navigator.sendBeacon("/log", JSON.stringify({ events: serverQueue }));
          } catch {
            /* ignore */
          }
        }
      });

      const homeScreen = document.getElementById("homeScreen");
      let onHomeScreen = true;

      /** What is on screen right now: stop | start | wall | maximized content label. */
      function currentScreenLabel() {
        if (runtimeState && runtimeState.emergencyStop === true) return "stop";
        if (onHomeScreen) return "start";
        if (!document.body.classList.contains("maximized")) return "wall";
        const active = document.querySelector('.tile[data-max="true"]');
        if (!active) return "wall";
        return tileLogFields(active).content || "wall";
      }

      function eventNameFor(type, reason) {
        if (type === "tile_maximize") return "view_selected";
        if (type === "tile_minimize") {
          if (reason === "idle") return "idle_timeout";
          if (reason === "esc") return "esc_deselect";
          if (reason === "close_button") return "close_button";
          return "view_deselected";
        }
        if (type === "home_show") return "start_enter";
        if (type === "home_hide") return "start_exit";
        if (type === "webcam_start") return "webcam_start";
        if (type === "webcam_stop") return "webcam_stop";
        if (type === "webcam_error") return "webcam_error";
        if (type === "emergency_stop") return "emergency_stop";
        if (type === "emergency_resume") return "emergency_resume";
        if (type === "fullscreen_lock_toggle") return "fullscreen_lock_toggle";
        if (type === "video_clip_start") return "clip_start";
        if (type === "live_tile_ready") return "live_ready";
        if (type === "active_user_set") return "active_user_set";
        if (type === "presence_on") return "presence_on";
        if (type === "presence_off") return "presence_off";
        if (type === "layout_assigned") return "layout_assigned";
        if (type === "wall_start") return "wall_start";
        if (type === "app_start") return "app_start";
        return type || "";
      }

      // USB webcam session recording (active while engagement screen is dismissed).
      // Chunks are uploaded continuously — whole-file POST+keepalive was failing (~64KB limit).
      let webcamStream = null;
      let mediaRecorder = null;
      let recordingStartedAt = null;
      let recordingActive = false;
      let recordingId = null;
      let recordingFilename = "";
      let recordingQueue = Promise.resolve();
      let chunkUploadQueue = Promise.resolve();

      function pickRecorderMime() {
        const candidates = [
          "video/webm;codecs=vp9,opus",
          "video/webm;codecs=vp8,opus",
          "video/webm;codecs=vp9",
          "video/webm;codecs=vp8",
          "video/webm",
        ];
        for (const t of candidates) {
          try {
            if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
          } catch {
            /* ignore */
          }
        }
        return "";
      }

      function stampForFilename(iso) {
        return String(iso || nowIso())
          .replace(/[:.]/g, "")
          .replace(/T/g, "_")
          .replace(/Z$/i, "");
      }

      function enqueueChunkUpload(blob) {
        if (!blob || !blob.size || !recordingId) return;
        const id = recordingId;
        chunkUploadQueue = chunkUploadQueue
          .then(async () => {
            const res = await fetch(`/api/recording/chunk?id=${encodeURIComponent(id)}`, {
              method: "POST",
              headers: { "Content-Type": "application/octet-stream" },
              body: blob,
            });
            if (!res.ok) {
              throw new Error(`chunk_upload_${res.status}`);
            }
          })
          .catch((err) => {
            logEvent("webcam_error", {
              message: String(err && err.message ? err.message : err),
            });
          });
      }

      function startWebcamRecording() {
        recordingQueue = recordingQueue
          .then(async () => {
            if (recordingActive) return;
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
              logEvent("webcam_error", { message: "getUserMedia unavailable" });
              return;
            }
            if (typeof MediaRecorder === "undefined") {
              logEvent("webcam_error", { message: "MediaRecorder unavailable" });
              return;
            }

            let stream;
            try {
              try {
                stream = await navigator.mediaDevices.getUserMedia({
                  video: { width: { ideal: 1280 }, height: { ideal: 720 } },
                  audio: true,
                });
              } catch {
                stream = await navigator.mediaDevices.getUserMedia({
                  video: true,
                  audio: false,
                });
              }
            } catch (err) {
              logEvent("webcam_error", {
                message: String(err && err.message ? err.message : err),
              });
              return;
            }

            recordingStartedAt = nowIso();
            const filename = `webcam_${sessionId}_${stampForFilename(recordingStartedAt)}.webm`;
            const mimeType = pickRecorderMime();

            let opened;
            try {
              const qs = new URLSearchParams({
                sessionId,
                startedAt: recordingStartedAt,
                filename,
              });
              const res = await fetch(`/api/recording/start?${qs.toString()}`, {
                method: "POST",
                headers: { "Content-Type": mimeType || "video/webm" },
              });
              opened = await res.json();
              if (!res.ok || !opened || !opened.ok || !opened.id) {
                throw new Error((opened && opened.error) || `start_failed_${res.status}`);
              }
            } catch (err) {
              stream.getTracks().forEach((t) => t.stop());
              logEvent("webcam_error", {
                message: String(err && err.message ? err.message : err),
              });
              return;
            }

            recordingId = opened.id;
            recordingFilename = opened.filename || filename;
            webcamStream = stream;
            chunkUploadQueue = Promise.resolve();

            const opts = mimeType
              ? { mimeType, videoBitsPerSecond: 2_500_000 }
              : { videoBitsPerSecond: 2_500_000 };
            let recorder;
            try {
              recorder = new MediaRecorder(stream, opts);
            } catch (err) {
              stream.getTracks().forEach((t) => t.stop());
              webcamStream = null;
              try {
                await fetch(`/api/recording/finish?id=${encodeURIComponent(recordingId)}`, {
                  method: "POST",
                });
              } catch {
                /* ignore */
              }
              recordingId = null;
              logEvent("webcam_error", {
                message: String(err && err.message ? err.message : err),
              });
              return;
            }

            mediaRecorder = recorder;
            recorder.ondataavailable = (e) => {
              if (e.data && e.data.size > 0) enqueueChunkUpload(e.data);
            };
            recorder.onerror = (e) => {
              logEvent("webcam_error", {
                message: String((e && e.error && e.error.message) || e.error || e),
              });
            };
            try {
              // 2s timeslices → small POSTs that survive reliably (unlike one giant upload).
              recorder.start(2000);
            } catch (err) {
              stream.getTracks().forEach((t) => t.stop());
              webcamStream = null;
              mediaRecorder = null;
              try {
                await fetch(`/api/recording/finish?id=${encodeURIComponent(recordingId)}`, {
                  method: "POST",
                });
              } catch {
                /* ignore */
              }
              recordingId = null;
              logEvent("webcam_error", {
                message: String(err && err.message ? err.message : err),
              });
              return;
            }
            recordingActive = true;
            logEvent("webcam_start", {
              reason: "active",
              message: recordingFilename,
              screen: "wall",
              event: "webcam_start",
            });
          })
          .catch((err) => {
            logEvent("webcam_error", {
              message: String(err && err.message ? err.message : err),
            });
          });
        return recordingQueue;
      }

      function stopWebcamRecording(reason) {
        recordingQueue = recordingQueue
          .then(async () => {
            const recorder = mediaRecorder;
            const stream = webcamStream;
            const id = recordingId;
            const savedName = recordingFilename;
            mediaRecorder = null;
            webcamStream = null;
            recordingStartedAt = null;
            recordingId = null;
            recordingFilename = "";
            recordingActive = false;

            if (!recorder && !id) {
              if (stream) stream.getTracks().forEach((t) => t.stop());
              return;
            }

            if (recorder && recorder.state !== "inactive") {
              await new Promise((resolve) => {
                recorder.addEventListener("stop", resolve, { once: true });
                try {
                  recorder.stop();
                } catch {
                  resolve();
                }
              });
            }

            // Let the final ondataavailable chunk enqueue, then drain uploads.
            await new Promise((r) => setTimeout(r, 50));
            await chunkUploadQueue.catch(() => {});

            if (stream) stream.getTracks().forEach((t) => t.stop());

            if (!id) {
              logEvent("webcam_stop", {
                reason: reason || "stop",
                message: "no_id",
                event: "webcam_stop",
              });
              return;
            }

            try {
              const res = await fetch(`/api/recording/finish?id=${encodeURIComponent(id)}`, {
                method: "POST",
              });
              let ok = res.ok;
              let filename = savedName;
              try {
                const j = await res.json();
                if (j && j.filename) filename = j.filename;
                if (j && j.ok === false) ok = false;
                if (ok && j && j.bytes != null) {
                  filename = `${filename} (${j.bytes} bytes)`;
                }
              } catch {
                /* ignore */
              }
              logEvent("webcam_stop", {
                reason: reason || "stop",
                message: ok ? filename : `finish_failed_${res.status}`,
                event: "webcam_stop",
                href: ok ? `logs/recordings/${savedName}` : "",
              });
            } catch (err) {
              logEvent("webcam_error", {
                reason: reason || "stop",
                message: String(err && err.message ? err.message : err),
                event: "webcam_error",
              });
            }
          })
          .catch((err) => {
            logEvent("webcam_error", {
              reason: reason || "stop",
              message: String(err && err.message ? err.message : err),
            });
          });
        return recordingQueue;
      }

      // Fullscreen lock (control panel / Ctrl+Shift+F). Active on engagement + wall when enabled.
      let fullscreenRetryTimer = 0;
      const chromeShield = document.getElementById("chromeShield");
      const stopScreen = document.getElementById("stopScreen");
      let emergencyUiOn = false;

      function isFullscreenLocked() {
        return runtimeState.lockFullscreen !== false;
      }

      function isEmergencyStop() {
        return runtimeState.emergencyStop === true;
      }

      function isDocumentFullscreen() {
        return Boolean(
          document.fullscreenElement ||
            document.webkitFullscreenElement ||
            document.msFullscreenElement
        );
      }

      function requestWallFullscreen() {
        if (!isFullscreenLocked()) return Promise.resolve();
        const el = document.documentElement;
        const req =
          el.requestFullscreen ||
          el.webkitRequestFullscreen ||
          el.msRequestFullscreen;
        if (!req) return Promise.resolve();
        try {
          const p = req.call(el);
          return p && typeof p.then === "function" ? p.catch(() => {}) : Promise.resolve();
        } catch {
          return Promise.resolve();
        }
      }

      function scheduleFullscreenRetry() {
        if (!isFullscreenLocked()) return;
        if (fullscreenRetryTimer) window.clearTimeout(fullscreenRetryTimer);
        fullscreenRetryTimer = window.setTimeout(() => {
          fullscreenRetryTimer = 0;
          if (!isFullscreenLocked() || isDocumentFullscreen()) return;
          requestWallFullscreen();
        }, 400);
      }

      function syncFullscreenLockUi() {
        if (chromeShield) chromeShield.hidden = !isFullscreenLocked();
        if (isFullscreenLocked() && !isDocumentFullscreen()) {
          scheduleFullscreenRetry();
        }
      }

      function pauseAllFeeds() {
        document.querySelectorAll("video.feed").forEach((v) => {
          try {
            v.pause();
          } catch {
            /* ignore */
          }
        });
      }

      function resumeAllFeeds() {
        document.querySelectorAll("video.feed").forEach((v) => {
          try {
            const p = v.play();
            if (p && typeof p.catch === "function") p.catch(() => {});
          } catch {
            /* ignore */
          }
        });
      }

      function syncEmergencyUi() {
        const want = isEmergencyStop();
        if (stopScreen) stopScreen.hidden = !want;
        syncMaxCloseButton();
        if (want === emergencyUiOn) return;
        emergencyUiOn = want;
        if (want) {
          stopWebcamRecording("emergency");
          pauseAllFeeds();
        } else {
          resumeAllFeeds();
          if (!onHomeScreen) startWebcamRecording();
        }
      }

      function setEmergencyStop(on, reason) {
        if ((runtimeState.emergencyStop === true) === on) {
          syncEmergencyUi();
          return;
        }
        runtimeState = writeState({ ...runtimeState, emergencyStop: on });
        broadcastState(runtimeState);
        syncEmergencyUi();
        logEvent(on ? "emergency_stop" : "emergency_resume", {
          reason: reason || "toggle",
          message: on ? "stop" : "resume",
          screen: on ? "stop" : currentScreenLabel(),
          event: on ? "emergency_stop" : "emergency_resume",
        });
      }

      function setFullscreenLock(on, reason) {
        if ((runtimeState.lockFullscreen !== false) === on) {
          syncFullscreenLockUi();
          return;
        }
        runtimeState = writeState({ ...runtimeState, lockFullscreen: on });
        broadcastState(runtimeState);
        syncFullscreenLockUi();
        if (on) requestWallFullscreen();
        logEvent("fullscreen_lock_toggle", {
          reason: reason || "toggle",
          message: on ? "locked" : "unlocked",
        });
      }

      document.addEventListener("fullscreenchange", () => {
        if (!isDocumentFullscreen() && isFullscreenLocked()) scheduleFullscreenRetry();
      });
      document.addEventListener("webkitfullscreenchange", () => {
        if (!isDocumentFullscreen() && isFullscreenLocked()) scheduleFullscreenRetry();
      });

      // Block right-click / long-press menus that open browser UI.
      document.addEventListener("contextmenu", (e) => e.preventDefault());

      // Any gesture can satisfy the fullscreen user-activation requirement when lock is on.
      document.addEventListener(
        "pointerdown",
        () => {
          if (isFullscreenLocked() && !isDocumentFullscreen()) requestWallFullscreen();
        },
        { passive: true }
      );

      function showHomeScreen(reason) {
        if (isEmergencyStop()) return;
        if (onHomeScreen && homeScreen && !homeScreen.hidden) return;
        // Leave any maximized tile before covering the wall.
        if (document.body.classList.contains("maximized")) {
          setFourUp(reason === "hotkey_b" ? "home" : reason || "home");
        }
        onHomeScreen = true;
        if (homeScreen) homeScreen.hidden = false;
        syncFullscreenLockUi();
        syncMaxCloseButton();
        noteActivity();
        stopWebcamRecording(reason || "home");
        logEvent("home_show", {
          reason: reason || "show",
          screen: "start",
          event: "start_enter",
        });
      }

      function hideHomeScreen(reason) {
        if (isEmergencyStop()) return;
        if (!onHomeScreen && homeScreen && homeScreen.hidden) return;
        onHomeScreen = false;
        if (homeScreen) homeScreen.hidden = true;
        syncFullscreenLockUi();
        syncMaxCloseButton();
        noteActivity();
        logEvent("home_hide", {
          reason: reason || "tap",
          screen: "wall",
          event: "start_exit",
        });
        // User gesture: safe place to enter fullscreen + start webcam.
        if (isFullscreenLocked()) requestWallFullscreen();
        startWebcamRecording();
        if (!wallStarted) startWall();
      }

      function handleHomePointer() {
        if (isEmergencyStop()) return;
        if (!onHomeScreen) return;
        if (inCooldown()) return;
        markTap();
        if (isFullscreenLocked()) requestWallFullscreen();
        hideHomeScreen("tap");
      }

      /** Basename of currently playing familiar (chimp) playlist clip — for participant matching. */
      let currentFamiliarFile = "";

      function basenameFromUrl(url) {
        const path = String(url || "").split("?")[0].split("#")[0];
        const parts = path.replace(/\\/g, "/").split("/");
        return parts[parts.length - 1] || "";
      }

      function logContext() {
        const presentIds = normalizePresentIds(runtimeState.presentIds);
        return {
          // participantID = active user; present = current area roster (updates on join/leave)
          participantId: runtimeState.participantId || "",
          present: presentIds.join(";"),
          screen: currentScreenLabel(),
          familiarFile: currentFamiliarFile || "",
          randomizeLayout: runtimeState.randomizeLayout !== false,
          layoutOrder: layoutOrder.join(";"),
          layoutIndex,
          source: "wall",
        };
      }

      function logEvent(type, details) {
        const reason = details && details.reason != null ? details.reason : "";
        const entry = {
          ts: nowIso(),
          sessionId,
          type,
          event: eventNameFor(type, reason),
          ...logContext(),
          ...details,
        };
        // Prefer explicit screen from details (after a layout change), else current.
        if (!entry.screen) entry.screen = currentScreenLabel();
        if (!entry.event) entry.event = eventNameFor(type, entry.reason || reason);
        const next = readLog();
        next.push(entry);
        writeLog(next);
        console.log("[CZTV]", entry);
        enqueueForServer(entry);
      }

      applyLayoutToDom();
      updateCoderHud();
      // Begin on the start image; wall media preloads underneath.
      onHomeScreen = true;
      if (homeScreen) homeScreen.hidden = false;
      syncFullscreenLockUi();
      syncEmergencyUi();
      logEvent("app_start", { href: location.href, screen: "start" });
      logEvent("layout_assigned", { screen: "start" });
      logEvent("home_show", { reason: "app_start", screen: "start", event: "start_enter" });
      broadcastLayout();

      function isCloseButtonExit() {
        return runtimeState.closeButtonExit === true;
      }

      function syncMaxCloseButton() {
        const btn = document.getElementById("maxCloseBtn");
        if (!btn) return;
        const show =
          isCloseButtonExit() &&
          document.body.classList.contains("maximized") &&
          !onHomeScreen &&
          !isEmergencyStop();
        btn.hidden = !show;
      }

      function setMax(tileEl, reason) {
        tiles.forEach((t) => t.setAttribute("data-max", t === tileEl ? "true" : "false"));
        document.body.classList.add("maximized");
        syncMaxCloseButton();
        noteActivity();
        const fields = tileLogFields(tileEl);
        logEvent("tile_maximize", {
          ...fields,
          reason,
          screen: fields.content || "wall",
          event: "view_selected",
        });
      }

      function setFourUp(reason) {
        const active = document.querySelector('.tile[data-max="true"]');
        if (!document.body.classList.contains("maximized") && !active) return;
        const fields = tileLogFields(active);
        tiles.forEach((t) => t.removeAttribute("data-max"));
        document.body.classList.remove("maximized");
        syncMaxCloseButton();
        noteActivity();
        const event =
          reason === "idle"
            ? "idle_timeout"
            : reason === "esc"
              ? "esc_deselect"
              : reason === "close_button"
                ? "close_button"
                : "view_deselected";
        logEvent("tile_minimize", {
          ...fields,
          reason,
          screen: "wall",
          event,
        });
      }

      function handleTilePointer(tileEl, clientX, clientY) {
        if (isEmergencyStop()) return;
        if (onHomeScreen) return;
        if (inCooldown()) return;
        // Close-button mode: ignore taps on the maximized surface (only the X works).
        if (document.body.classList.contains("maximized") && isCloseButtonExit()) return;
        // When maximized (tap-to-return), whole screen is one tile — no edge dead-zone.
        if (!document.body.classList.contains("maximized")) {
          if (isInTileDeadZone(tileEl, clientX, clientY)) return;
        }
        markTap();
        if (document.body.classList.contains("maximized")) setFourUp("tap");
        else setMax(tileEl, "tap");
      }

      {
        const maxCloseBtn = document.getElementById("maxCloseBtn");
        if (maxCloseBtn) {
          maxCloseBtn.addEventListener("pointerup", (e) => {
            if (e.button != null && e.button !== 0) return;
            e.preventDefault();
            e.stopPropagation();
            if (isEmergencyStop() || onHomeScreen) return;
            if (!document.body.classList.contains("maximized")) return;
            if (!isCloseButtonExit()) return;
            if (inCooldown()) return;
            markTap();
            setFourUp("close_button");
          });
        }
      }

      tiles.forEach((t) => {
        t.addEventListener(
          "pointerup",
          (e) => {
            if (e.button != null && e.button !== 0) return;
            handleTilePointer(t, e.clientX, e.clientY);
          },
          { passive: true }
        );
      });

      setInterval(() => {
        if (isEmergencyStop()) return;
        if (onHomeScreen) return;
        if (!document.body.classList.contains("maximized")) return;
        if (Date.now() - lastActivityAt < idleResetMs()) return;
        setFourUp("idle");
      }, 5000);

      function broadcastState(next) {
        if (!bc) return;
        try {
          bc.postMessage({ type: "state", payload: next });
        } catch {
          /* ignore */
        }
      }

      function setActiveUser(pid, reason, key) {
        const ensurePresent =
          (CZTV && CZTV.ensurePresentIncludes) ||
          ((presentIds, participantId) => {
            const list = normalizePresentIds(presentIds);
            if (!participantId || list.includes(participantId)) return list;
            return normalizePresentIds([...list, participantId]);
          });
        const prev = runtimeState.participantId || "";
        const prevPresent = normalizePresentIds(runtimeState.presentIds);
        const presentIds = ensurePresent(prevPresent, pid);
        const newlyPresent = Boolean(pid) && !prevPresent.includes(pid);
        if (prev === pid && !newlyPresent) {
          updateCoderHud();
          return runtimeState;
        }
        runtimeState = writeState({ ...runtimeState, participantId: pid, presentIds });
        updateCoderHud();
        broadcastState(runtimeState);
        noteActivity();
        if (prev !== pid) {
          logEvent("active_user_set", {
            reason,
            message: `${prev || "—"}→${pid}`,
          });
        }
        if (newlyPresent) {
          logEvent("presence_on", {
            reason: reason ? `${reason}+active` : "active",
            message: pid,
          });
        }
        return runtimeState;
      }

      function togglePresence(pid, reason, key) {
        const current = new Set(normalizePresentIds(runtimeState.presentIds));
        const wasPresent = current.has(pid);
        if (wasPresent) current.delete(pid);
        else current.add(pid);
        const presentIds = normalizePresentIds([...current]);
        runtimeState = writeState({ ...runtimeState, presentIds });
        updateCoderHud();
        broadcastState(runtimeState);
        noteActivity();
        logEvent(wasPresent ? "presence_off" : "presence_on", {
          reason,
          message: pid,
        });
        return runtimeState;
      }

      document.addEventListener("keydown", (e) => {
        if (isTypingTarget(e.target)) return;
        const key = String(e.key || "").toLowerCase();

        // Ctrl+Shift+F → toggle fullscreen lock (same as control panel)
        if (key === "f" && e.ctrlKey && e.shiftKey && !e.altKey && !e.metaKey) {
          e.preventDefault();
          setFullscreenLock(!isFullscreenLocked(), "hotkey");
          return;
        }

        // x → emergency stop / resume
        if (key === "x" && !e.altKey && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
          e.preventDefault();
          setEmergencyStop(!isEmergencyStop(), "hotkey_x");
          return;
        }

        if (isEmergencyStop()) return;

        // b → return to full-screen start image
        if (key === "b" && !e.altKey && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
          e.preventDefault();
          if (inCooldown()) return;
          markTap();
          showHomeScreen("hotkey_b");
          return;
        }

        if (e.key === "Escape") {
          // While locked, ignore Esc so chimps can't leave fullscreen / deselect via browser.
          if (isFullscreenLocked()) {
            e.preventDefault();
            return;
          }
          if (onHomeScreen) return;
          if (!inCooldown()) {
            markTap();
            setFourUp("esc");
          }
          return;
        }

        if (onHomeScreen) return;
        const hit = resolvePidHotkey(e);
        if (!hit) return;
        e.preventDefault();
        noteActivity();
        if (hit.shift) setActiveUser(hit.pid, "hotkey_shift", hit.key);
        else togglePresence(hit.pid, "hotkey", hit.key);
      });

      if (homeScreen) {
        homeScreen.addEventListener(
          "pointerup",
          (e) => {
            if (e.button != null && e.button !== 0) return;
            handleHomePointer();
          },
          { passive: true }
        );
        homeScreen.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            handleHomePointer();
          }
        });
      }

      window.addEventListener("pagehide", () => {
        if (recordingActive || mediaRecorder) {
          stopWebcamRecording("unload");
        }
      });

      const startOverlay = document.getElementById("startOverlay");
      const startBtn = document.getElementById("btnStart");
      const feeds = Array.from(document.querySelectorAll("video.feed"));
      let hlsPlayers = [];
      let playlistHandlers = [];
      let mediaInFlight = false;
      let wallStarted = false;

      function stopHlsPlayers() {
        hlsPlayers.forEach((h) => {
          try {
            h.destroy();
          } catch {
            /* ignore */
          }
        });
        hlsPlayers = [];
      }

      function clearPlaylists() {
        playlistHandlers.forEach(({ video, onEnded }) => {
          try {
            video.removeEventListener("ended", onEnded);
          } catch {
            /* ignore */
          }
        });
        playlistHandlers = [];
      }

      function setPlaceholder(tileIndex, text) {
        const v = feeds[tileIndex];
        const ph = v?.closest(".tileBody")?.querySelector(".placeholder");
        if (ph) ph.textContent = text || "";
      }

      function markTileReady(tileIndex, ready) {
        const v = feeds[tileIndex];
        if (!v) return;
        const tile = v.closest(".tile");
        if (ready) {
          v.dataset.ready = "true";
          if (tile) tile.dataset.ready = "true";
        } else {
          v.removeAttribute("data-ready");
          if (tile) tile.removeAttribute("data-ready");
        }
      }

      function clearAllFeeds() {
        stopHlsPlayers();
        clearPlaylists();
        feeds.forEach((v, i) => {
          try {
            v.pause();
          } catch {
            /* ignore */
          }
          v.removeAttribute("src");
          v.srcObject = null;
          try {
            v.load();
          } catch {
            /* ignore */
          }
          markTileReady(i, false);
          setPlaceholder(i, "");
        });
      }

      function attachHlsToVideo(video, url) {
        return new Promise((resolve) => {
          let settled = false;
          const done = (ok) => {
            if (settled) return;
            settled = true;
            resolve(ok);
          };

          if (window.Hls && window.Hls.isSupported()) {
            const hls = new window.Hls({ lowLatencyMode: true, backBufferLength: 0 });
            hlsPlayers.push(hls);
            hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
              video
                .play()
                .then(() => done(true))
                .catch(() => done(false));
            });
            hls.on(window.Hls.Events.ERROR, (_e, data) => {
              if (data && data.fatal) done(false);
            });
            hls.loadSource(url);
            hls.attachMedia(video);
            return;
          }

          if (video.canPlayType("application/vnd.apple.mpegurl")) {
            video.src = url;
            video
              .play()
              .then(() => done(true))
              .catch(() => done(false));
            return;
          }

          done(false);
        });
      }

      function showOverlay() {
        // Keep the home PNG / emergency stop on top; researcher Start is for the wall only.
        if (onHomeScreen || isEmergencyStop()) return;
        startBtn.textContent = "Start";
        startOverlay.hidden = false;
      }

      function hideOverlay() {
        startOverlay.hidden = true;
      }

      async function pushLiveCamerasFromScript() {
        const body = liveCamerasPayload();
        const res = await fetch("/api/cameras", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const cfg = await res.json();
        if (!res.ok || cfg.ok === false) {
          throw new Error(cfg.error || "Failed to apply script camera config");
        }
        return cfg;
      }

      async function startLiveTiles() {
        const liveViews = ["live1", "live2"];
        let cfg;
        try {
          cfg = await pushLiveCamerasFromScript();
        } catch (err) {
          const res = await fetch("/api/cameras");
          cfg = await res.json();
          logEvent("live_cameras_push_failed", {
            message: String(err && err.message ? err.message : err),
          });
        }

        const cameras = Array.isArray(cfg.cameras) ? cfg.cameras : [];

        if (!cfg.ffmpeg) {
          liveViews.forEach((viewId) => {
            const i = slotIndexForView(viewId);
            if (i < 0) return;
            setPlaceholder(i, "Live camera\nffmpeg not found — install FFmpeg and restart the server.");
          });
          return { expected: 0, ok: 0 };
        }

        let expected = 0;
        let ok = 0;

        for (let camIdx = 0; camIdx < liveViews.length; camIdx += 1) {
          const viewId = liveViews[camIdx];
          const tileIndex = slotIndexForView(viewId);
          if (tileIndex < 0) continue;

          const cam = cameras[camIdx] || {};
          const url = cam.host ? `/stream/${cam.id}/index.m3u8` : "";
          const label = cam.label || VIEW_LABELS[viewId] || viewId;
          const host = cam.host ? `${cam.host}${cam.path || ""}` : "not configured";
          setPlaceholder(tileIndex, url ? `${label}\n${host}` : `${label}\nNo stream configured`);

          const v = feeds[tileIndex];
          if (!v) continue;
          v.muted = true;
          v.loop = false;
          v.playsInline = true;
          v.srcObject = null;
          v.removeAttribute("src");

          if (!url) continue;
          expected += 1;
          const played = await attachHlsToVideo(v, url);
          if (played) {
            ok += 1;
            markTileReady(tileIndex, true);
            logEvent("live_tile_ready", {
              tile: String(tileIndex + 1),
              content: contentLabelForView(viewId),
              viewId,
            });
          } else {
            setPlaceholder(tileIndex, `${label}\nStream failed to start`);
          }
        }

        return { expected, ok };
      }

      function startVideoPlaylist(tileIndex, setId) {
        const urls = (VIDEO_SETS[setId] || []).filter(Boolean);
        const label = VIEW_LABELS[setId] || setId;
        const v = feeds[tileIndex];
        if (!v) return false;

        if (!urls.length) {
          setPlaceholder(tileIndex, `${label}\nNo clips configured`);
          return false;
        }

        setPlaceholder(tileIndex, label);
        v.muted = true;
        v.playsInline = true;
        v.srcObject = null;
        v.loop = urls.length === 1;

        let idx = Math.floor(Math.random() * urls.length);

        const playAt = (i) => {
          const url = urls[((i % urls.length) + urls.length) % urls.length];
          const clipFile = basenameFromUrl(url);
          v.src = url;
          if (setId === "familiar") currentFamiliarFile = clipFile;
          logEvent("video_clip_start", {
            tile: String(tileIndex + 1),
            content: contentLabelForView(setId),
            viewId: setId,
            url,
            clipFile,
            clipIndex: i % urls.length,
          });
          return v.play().then(
            () => {
              markTileReady(tileIndex, true);
              return true;
            },
            () => false
          );
        };

        const onEnded = () => {
          if (urls.length <= 1) return;
          idx = (idx + 1) % urls.length;
          playAt(idx);
        };

        v.addEventListener("ended", onEnded);
        playlistHandlers.push({ video: v, onEnded });

        return playAt(idx);
      }

      async function startVideoTiles() {
        const videoViews = ["familiar", "unfamiliar"];
        const results = await Promise.all(
          videoViews.map(async (setId) => {
            const tileIndex = slotIndexForView(setId);
            if (tileIndex < 0) return false;
            return Boolean(await startVideoPlaylist(tileIndex, setId));
          })
        );
        return {
          expected: results.length,
          ok: results.filter(Boolean).length,
        };
      }

      async function startWall() {
        if (mediaInFlight) return;
        mediaInFlight = true;
        startBtn.disabled = true;
        try {
          clearAllFeeds();
          applyLayoutToDom();
          const video = await startVideoTiles();
          let live = { expected: 0, ok: 0 };
          try {
            live = await startLiveTiles();
          } catch (liveErr) {
            logEvent("live_tiles_error", {
              message: String(liveErr && liveErr.message ? liveErr.message : liveErr),
            });
            ["live1", "live2"].forEach((viewId) => {
              const i = slotIndexForView(viewId);
              if (i >= 0) setPlaceholder(i, "Live camera\nCould not reach camera bridge");
            });
          }
          const anyReady = live.ok + video.ok > 0;
          wallStarted = anyReady;
          if (anyReady) {
            hideOverlay();
          } else {
            showOverlay();
          }
          logEvent("wall_start", {
            message: `live ${live.ok}/${live.expected}; video ${video.ok}/${video.expected}`,
          });
        } catch (err) {
          clearAllFeeds();
          wallStarted = false;
          showOverlay();
          logEvent("wall_start_error", { message: String(err && err.message ? err.message : err) });
        } finally {
          startBtn.disabled = false;
          mediaInFlight = false;
        }
      }

      function applyRemoteState(next) {
        // Originating tab already logged the hotkey/form change; just sync UI here.
        // randomizeLayout changes apply on the next wall page load (not mid-session).
        runtimeState = writeState(next);
        updateCoderHud();
        syncFullscreenLockUi();
        syncEmergencyUi();
      }

      if (bc) {
        bc.addEventListener("message", (ev) => {
          if (!ev.data) return;
          if (ev.data.type === "state" && ev.data.payload) {
            applyRemoteState(ev.data.payload);
            return;
          }
          if (ev.data.type === "cameras_updated" && wallStarted) {
            startWall();
          }
        });
      }

      window.addEventListener("storage", (e) => {
        if (e.key !== window.CZTV.STORAGE_KEY || e.newValue == null) return;
        try {
          applyRemoteState(JSON.parse(e.newValue));
        } catch {
          /* ignore */
        }
      });

      startBtn.addEventListener("click", () => {
        startWall();
      });

      // Autoplay / HLS often needs a gesture; try once, show overlay if blocked.
      startWall().then(() => {
        if (!wallStarted) showOverlay();
      });
    </script>
  </body>
</html>
